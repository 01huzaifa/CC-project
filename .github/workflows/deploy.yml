name: CI/CD - test, build, push, deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  OWNER: 01huzaifa          # GitHub username, lowercase (GHCR requires lowercase)
  AWS_REGION: ap-south-1
  ASG_NAME: cea-shop-asg

jobs:
  # ---------- 1. TEST ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run unit tests
        working-directory: app
        run: pytest -q

  # ---------- 2. BUILD AND PUSH IMAGES ----------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/cea-shop-app:latest
            ghcr.io/${{ env.OWNER }}/cea-shop-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/cea-shop-web:latest
            ghcr.io/${{ env.OWNER }}/cea-shop-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ---------- 3. DEPLOY ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # New servers pull the :latest images at boot (launch template user data),
      # so replacing the servers one by one deploys the new version with no downtime.
      - name: Start rolling instance refresh
        id: refresh
        run: |
          ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}' \
            --query InstanceRefreshId --output text)
          echo "Started instance refresh: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the refresh to finish
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "${{ steps.refresh.outputs.id }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "[$i/60] Refresh status: $STATUS"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackInProgress|RollbackFailed|RollbackSuccessful)
                echo "Deployment failed"; exit 1 ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for the refresh"; exit 1

      - name: Smoke test the live site
        run: |
          curl -fsS --retry 5 --retry-delay 10 "${{ secrets.ALB_URL }}/health"
          echo
          curl -fsS "${{ secrets.ALB_URL }}/api/products" | head -c 300
          echo
          echo "Deployment verified"
